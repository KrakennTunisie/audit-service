spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@gmail.com
    password: test